    <text x="29" y="18" fill="#DADEFA" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1">USAGE MONITOR</text>
    <path d="M22 93H172" stroke="#8B98C0" stroke-opacity=".5"/>
    <path d="M30 91V74m23 17V65m23 26V79m23 12V51m23 40V59m23 32V42m23 49V54" stroke="#A9D4CB" stroke-width="11"/>
