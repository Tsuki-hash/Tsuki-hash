<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tsuki — Clarity, by design.</title>
  <desc id="desc">A lavender moon above two small desktop windows, representing Windows utilities made with care.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DADEFA" stroke-opacity=".05"/></pattern>
    <mask id="crescent"><rect width="1200" height="360" fill="white"/><circle cx="1031" cy="67" r="76" fill="black"/></mask>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#252C52"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M720 360V0" stroke="#DADEFA" stroke-opacity=".14"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="48" fill="#A9D4CB" font-size="13" letter-spacing="3">TSUKI-HASH / OPEN SOURCE</text>
    <text x="52" y="155" fill="#F4F1FB" font-family="Georgia, 'Times New Roman', serif" font-size="100">Tsuki<tspan fill="#F2D6B1">.</tspan></text>
    <text x="56" y="212" fill="#DADEFA" font-size="32" font-weight="500">Clarity, by design.</text>
    <text x="56" y="253" fill="#B1B8D6" font-size="17">Crafting considered experiences for Windows.</text>
    <path d="M56 294H88" stroke="#A9D4CB" stroke-width="2"/>
    <text x="104" y="300" fill="#A9D4CB" font-size="12" letter-spacing="2">RUST / TAURI / REACT / TYPESCRIPT</text>
  </g>
  <circle cx="990" cy="100" r="76" fill="#F2D6B1" mask="url(#crescent)"/>
  <circle cx="874" cy="59" r="3" fill="#DADEFA"/>
  <path d="M1105 152v12m-6-6h12M794 109v8m-4-4h8" stroke="#A9D4CB" stroke-width="1.5"/>
  <g transform="translate(780 144)">
    <rect width="222" height="146" rx="12" fill="#30385F" stroke="#6E7AA5"/>
    <path d="M0 30H222" stroke="#6E7AA5"/>
    <circle cx="16" cy="15" r="3" fill="#F2D6B1"/><circle cx="28" cy="15" r="3" fill="#A9D4CB"/><circle cx="40" cy="15" r="3" fill="#9CA9D7"/>
    <path d="M35 62l21-8 21 8v20c0 16-21 27-21 27S35 98 35 82Z" fill="none" stroke="#A9D4CB" stroke-width="2"/>
